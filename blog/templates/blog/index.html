{% extends "blog/base.html" %}
{% block title %}
  Posts
{% endblock title %}
{% block content %}
  <h1>Posts</h1>
  <ul class="post-list">
    {% for post in posts %}
      <li>
        <a href="/posts/{{ post.id }}/"><strong>{{ post.title }}</strong></a>
        <span class="author">by {{ post.author.full_name }}</span>
      </li>
    {% empty %}
      <li>No posts available.</li>
    {% endfor %}
  </ul>
{% endblock content %}
